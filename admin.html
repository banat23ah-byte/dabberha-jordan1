    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b42318" : "#16794b";
    }

    function showLoggedIn(isLoggedIn) {
      loginSection.classList.toggle("hidden", isLoggedIn);
      adminSection.classList.toggle("hidden", !isLoggedIn);
    }

    function clearPreview() {
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      imagePreview.removeAttribute("src");
      imagePreview.classList.add("hidden");
    }

    imageFileInput.addEventListener("change", () => {
      const file = imageFileInput.files[0];

      clearPreview();

      if (!file) {
        return;
      }

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      if (!allowedTypes.includes(file.type)) {
        imageFileInput.value = "";
        showMessage(
          "اختَر صورة بصيغة JPG أو PNG أو WEBP.",
          true
        );
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        imageFileInput.value = "";
        showMessage(
          "حجم الصورة يجب ألا يتجاوز 5 ميغابايت.",
          true
        );
        return;
      }

      previewUrl = URL.createObjectURL(file);
      imagePreview.src = previewUrl;
      imagePreview.classList.remove("hidden");

      showMessage("تم اختيار الصورة بنجاح.");
    });

    async function refreshSession() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        showMessage("تعذّر التحقق من تسجيل الدخول.", true);
        return;
      }

      const session = data.session;

      showLoggedIn(Boolean(session));

      if (session) {
        await loadOffers();
      }
    }

    document
      .getElementById("login-button")
      .addEventListener("click", async () => {
        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        if (!email || !password) {
          showMessage(
            "اكتب البريد الإلكتروني وكلمة المرور.",
            true
          );
          return;
        }

        const loginButton =
          document.getElementById("login-button");

        loginButton.disabled = true;
        showMessage("جارٍ تسجيل الدخول...");

        try {
          const { error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            showMessage(
              "تعذّر تسجيل الدخول. تأكد من البريد وكلمة المرور.",
              true
            );
            return;
          }

          showMessage("تم تسجيل الدخول.");
          await refreshSession();

        } catch (error) {
          console.error(error);
          showMessage("حدث خطأ أثناء تسجيل الدخول.", true);

        } finally {
          loginButton.disabled = false;
        }
      });

    document
      .getElementById("logout-button")
      .addEventListener("click", async () => {
        const { error } = await supabase.auth.signOut();

        if (error) {
          showMessage("تعذّر تسجيل الخروج.", true);
          return;
        }

        showLoggedIn(false);
        showMessage("تم تسجيل الخروج.");
      });

        };

    async function loadOffers() {

        .from("offers")
        .select(
         "*"

        )
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Load offers error:", error);

        offersList.textContent = "تعذّر تحميل العروض.";

        showMessage(
          "تحقق من صلاحيات جدول offers في Supabase.",
          true
        );
        return;
      }

      offersList.replaceChildren();

      if (!data || data.length === 0) {
        offersList.textContent = "لسه ما أضفت أي عروض.";
        return;

        const card = document.createElement("article");
        card.className = "offer";

        const heading = document.createElement("strong");
        heading.textContent = offer.title;

        const details = document.createElement("p");
        details.textContent =
          offer.shop_name +
          (offer.price !== null ? " — السعر: " + offer.price : "") +
          (offer.is_published ? " — منشور" : " — مسودة");

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = offer.is_published

        });
